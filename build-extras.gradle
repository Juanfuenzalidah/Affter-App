// Fix Kotlin stdlib duplicate classes issue
// Since Kotlin 1.8+, kotlin-stdlib includes jdk7 and jdk8 modules
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        // Upgrade GMA SDK from deprecated 20.6.0 to 22.6.0
        // NOTE: 23.x removed MobileAds.getVersionString() used by admob-plus-cordova
        force 'com.google.android.gms:play-services-ads:22.6.0'
        force 'com.google.android.gms:play-services-ads-lite:22.6.0'
    }
}
